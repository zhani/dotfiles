# Cross-platform: always launch bash as a login shell, regardless of which
# shell started the tmux server (otherwise it inherits zsh on macOS). `bash`
# has no hardcoded path, so it resolves per-OS (brew bash on mac, system bash
# on Ubuntu).
setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# Set terminal with proper colors
set -g default-terminal "xterm-256color"
set -g terminal-features ",xterm-256color:RGB"

set -g default-command "bash -l"

set -g mouse on
set-option -g set-clipboard on
set -g allow-passthrough on
set-option -g history-limit 50000
setw -g mode-keys vi

# Enable focus events for vim autoread
set -g focus-events on

# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Reload configuration
unbind r
bind-key r source-file ~/.config/tmux/tmux.conf

# Act like vim
setw -g mode-keys vi

bind | split-window -hc "#{pane_current_path}"
bind - split-window -vc "#{pane_current_path}"

# Enable name panes
# set -g pane-border-format "#{pane_index} #{pane_title}"
# set -g pane-border-format "#{pane_index}: #{pane_current_command}"
# set -g pane-border-status bottom

# Windows
set -g status-position top
# set -g automatic-rename on
# set -g window-status-format ' #I:#W '
# set -g window-status-current-format ' #I:#W '

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

# Configure Catppuccin
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "basic" # basic, rounded, slanted, custom, or none
# set -g @catppuccin_window_text " #W"
# set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #{b:pane_current_path}"
set -g @catppuccin_window_current_text " #{b:pane_current_path}"
set -g @catppuccin_status_background "none"

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
# set -ag status-right "#{E:@catppuccin_status_session}"
# set -ag status-right "#{E:@catppuccin_status_uptime}"

# Initialize tmux plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# optional, explicit pane inheritance (after the plugin)
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'

